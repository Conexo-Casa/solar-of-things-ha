name: Bug Report
description: Report a problem with the Solar of Things integration
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill in as much detail as possible.
        **Redact your IOT-Token** — keep only the first and last 4 characters.

        **Before you file:** this integration is built and maintained for the
        author's own inverter (a Sumry 3600), shared as-is — not a supported
        product for every Siseli-connected device. See [Support &
        Scope](https://github.com/Conexo-Casa/solar-of-things-ha#support--scope)
        in the README. The detail you provide below (exact field names, a raw
        API capture, your inverter/dongle model) is what actually gets bugs
        fixed for hardware the author doesn't own — a report without it is
        much less likely to go anywhere. Forking and patching it yourself is
        always an option too.

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "e.g. 2024.3.1"
    validations:
      required: true

  - type: input
    id: integration_version
    attributes:
      label: Integration version
      placeholder: "e.g. v2.1.1"
    validations:
      required: true

  - type: dropdown
    id: install_method
    attributes:
      label: Installation method
      options:
        - HACS
        - Manual
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      placeholder: "What happened? What did you expect?"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Home Assistant log snippet
      description: "Settings → System → Logs. Include the endpoint, HTTP status, and JSON response."
      render: text
    validations:
      required: false

  - type: input
    id: station_id
    attributes:
      label: Station ID (safe to share)
      description: "The numeric `stationId` from the portal Network payload — usually 18 digits. Not a serial number."
      placeholder: "423564214316007425"
    validations:
      required: false

  - type: input
    id: device_id
    attributes:
      label: Device ID (safe to share)
      description: "The numeric `deviceId` from the portal Network payload — usually 18 digits. Not a serial number."
      placeholder: "423564214341173249"
    validations:
      required: false

  - type: input
    id: timezone
    attributes:
      label: Time zone configured in integration
      placeholder: "e.g. Asia/Manila"
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      placeholder: "Inverter model, portal behavior, etc."
    validations:
      required: false
