name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please describe the feature clearly.

        This integration is maintained for the author's own hardware on a
        best-effort basis — see [Support &
        Scope](https://github.com/Conexo-Casa/solar-of-things-ha#support--scope)
        in the README. Feature requests for devices the author doesn't own are
        welcome, but a pull request gets there faster than a request alone.

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      placeholder: "What problem does this solve or what would it improve?"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      placeholder: "Describe what you'd like to see."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: "Any workarounds you've tried?"
    validations:
      required: false
